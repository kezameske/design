# OTT Poster Automation System — configuration file
# Schema: see ARCHITECTURE.md §7

# ── Image model catalog (shown in the Streamlit sidebar dropdown) ──
# Only includes image-output-capable models verified via OpenRouter `/api/v1/models`.
# Swapping models changes prompt behavior, so 1–2 titles may need re-tuning.
# cost_per_image is an estimate based on output tokens (actual billing follows OpenRouter's metering).
# FLUX/Seedream/Ideogram are not on OpenRouter — they require direct fal.ai/Replicate calls.
models:
  default: "google/gemini-3.1-flash-image-preview"
  available:
    - id: "google/gemini-2.5-flash-image"
      label: "Gemini 2.5 Flash Image (Nano Banana) — cheapest, balanced"
      cost_per_image: 0.04
    - id: "google/gemini-3.1-flash-image-preview"
      label: "Gemini 3.1 Flash Image (preview) — newer, similar price"
      cost_per_image: 0.05
    - id: "openai/gpt-5-image-mini"
      label: "GPT-5 Image Mini — strong OpenAI multilingual text, cheap"
      cost_per_image: 0.04
  # Disabled (over $0.10/image — $1.2–$2.4 per title):
  #   - google/gemini-3-pro-image-preview ($0.20)
  #   - openai/gpt-5-image ($0.13)
  #   - openai/gpt-5.4-image-2 ($0.19)

# ── Text LLM (language detection / translation) ──
# Google Gemini text is reliably accessible with the user's OpenRouter key.
# openai/gpt-4o-mini can return 403 on some accounts, so it is avoided.
text_llm: "google/gemini-2.5-flash"

# ── Output filename template ──
# Available variables: {slug} {seq} {lang} {type} {variant} {variant_suffix} {date}
# lang  ∈ kr | en | cn | clean
# type  ∈ portrait | landscape | logo | main-banner
# e.g. "kr-portrait-title.png", "clean-landscape-title.png", "cn-main-banner-title.png"
filename_template: "{lang}-{type}-title.png"

# ── Output folder pattern ──
output_folder: "ready/{slug}/"

# ── Pixel specs (overridable) ──
specs:
  portrait:  [900, 1600]
  landscape: [1600, 900]
  title:     [580, 200]
  banner:    [1520, 536]

# ── Per-model prompt overrides (optional) ──
# Key by model id, value is the path to per-step prompt files.
# Leave empty to use the default templates in the prompts/ folder.
# Example:
# prompts_override:
#   "openai/gpt-image-1":
#     clean: "prompts/clean_gpt.txt"
#     outpaint_landscape: "prompts/outpaint_landscape_gpt.txt"
prompts_override: {}
